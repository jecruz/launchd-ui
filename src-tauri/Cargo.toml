[package]
name = "daemonic"
version = "1.2.1"
description = "A GUI for managing macOS launchd agents and daemons"
authors = ["azu"]
license = "MIT"
repository = "https://github.com/azu/launchd-ui"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "launchd_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.0", features = ["tray-icon"] }
plist = "1"
thiserror = "2"
dirs = "6"
libc = "0.2"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "native-tls-no-alpn"] }

[dev-dependencies]
tempfile = "3"
